# systemd-sleep on a Kidux machine. docs/dev/power.md, D119.
[Sleep]
# A Kidux computer suspends, and never hibernates: a start that cannot
# restore what was saved hangs at every start until someone at a boot
# prompt says noresume, and no family can be asked to. Without these,
# a key, a program or logind could still hibernate it.
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no

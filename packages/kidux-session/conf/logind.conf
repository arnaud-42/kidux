# systemd-logind on a Kidux machine. docs/dev/session.md, section 6.
[Login]
# No spare virtual terminals to switch to.
NAutoVTs=0
ReserveVT=0
# A child's processes end with their session; nothing keeps running, or
# listening, for the next one.
KillUserProcesses=yes
# The power key belongs to kidux-daemon, which puts a trusted screen up
# instead of turning the machine off without asking anyone (D16).
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
# The lid is kidux-daemon's to set, from the panel's Suspend and hibernate page: it
# writes /etc/systemd/logind.conf.d/50-kidux-power.conf (power.md). Closing
# the lid is still not a way out of a time limit: before any sleep the
# daemon locks a child's session, holding the sleep back with a delay lock
# for as long as a lock takes, the lock screen's start and the switch to it.
InhibitDelayMaxSec=15

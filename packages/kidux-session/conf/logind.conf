# systemd-logind on a Kidux machine. docs/dev/session.md, section 6.
[Login]
# No spare virtual terminals to switch to.
NAutoVTs=0
ReserveVT=0
# A child's processes end with their session; nothing keeps running, or
# listening, for the next one.
KillUserProcesses=yes
# The power key belongs to kidux-daemon, which puts a trusted screen up
# instead of turning the machine off without asking anyone (D16).
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
# logind never acts on the lid: kidux-daemon suspends when it sees the lid
# close, as the panel's Suspending the computer page says, and only once a
# child's session is locked and the lid still reads closed (power.md). A
# lid switch can read closed with the lid open, as a MacBook's does after
# a failed resume, and logind would suspend at every start. Closing the lid
# is not a way out of a time limit either way.
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
# Before any sleep the daemon locks a child's session, holding the sleep
# back with a delay lock for as long as a lock takes, the lock screen's
# start and the switch to it.
InhibitDelayMaxSec=15

# A swap file as large as the memory, in place of the partition step's
# smaller one, and the start after hibernating told where it is
# (kidux-hibernate-setup of kidux-session, docs/dev/power.md), so that the
# installed computer can suspend and then hibernate. Run in the new
# system, before the initramfs and GRUB's configuration are made, which
# take what it writes.
---
dontChroot: false
timeout: 600
script:
    - "/usr/sbin/kidux-hibernate-setup --install"
